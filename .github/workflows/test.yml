name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  # De app echt in een browser: oplossen, opslag, de reeks, offline en updates.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log || {
            grep -n "^not ok" -A40 e2e.log | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > ann.txt
            echo "::error title=e2e::$(cat ann.txt | cut -c1-60000)"
            exit 1; }
